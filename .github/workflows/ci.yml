name: CI

# The ship policy merges to claude/media-haven without an approval gate, and
# claude/media-haven deploys production to guest TVs. Until this workflow
# existed, the only thing standing between a broken build and every screen in
# every villa was an agent remembering to run the smoke suite by hand. This is
# that gate, enforced.
#
# No secrets needed: the app runs in demo/mock mode when Supabase and Guesty
# are unconfigured, which is exactly the mode the smoke suite targets.

on:
  pull_request:
    branches: [claude/media-haven]
  push:
    branches: [claude/media-haven]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · build · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: PostgREST integration (orgs.settings version CAS)
        run: |
          docker compose -f tests/postgrest/docker-compose.yml up -d db
          for i in $(seq 1 30); do
            docker compose -f tests/postgrest/docker-compose.yml exec -T db pg_isready -U postgres && break
            sleep 1
          done
          docker compose -f tests/postgrest/docker-compose.yml up -d postgrest
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:54321/orgs?select=id&limit=1"; then
              echo "postgrest ready after ${i}s"
              break
            fi
            sleep 1
          done
          export SCREENSAVER_POSTGREST_URL=http://127.0.0.1:54321
          export POSTGREST_INTEGRATION_PHASE=fallback
          node tests/screensaver-hidden-postgrest-runner.mjs || {
            docker compose -f tests/postgrest/docker-compose.yml logs
            exit 1
          }
          docker compose -f tests/postgrest/docker-compose.yml exec -T db \
            psql -U postgres -v ON_ERROR_STOP=1 \
            -f - < supabase/migrations/0024_orgs_settings_version.sql
          docker compose -f tests/postgrest/docker-compose.yml restart postgrest
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:54321/orgs?select=id,version&limit=1"; then
              echo "postgrest schema reload after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:54321/orgs?select=version&limit=1" | grep -q version
          export POSTGREST_INTEGRATION_PHASE=version
          node tests/screensaver-hidden-postgrest-runner.mjs || {
            docker compose -f tests/postgrest/docker-compose.yml logs
            exit 1
          }
          docker compose -f tests/postgrest/docker-compose.yml down -v

      - name: Build
        run: npm run build

      # playwright-core ships no browser; fetch the matching Chromium and hand
      # the smoke suite its path (the same CHROMIUM_PATH contract used locally).
      - name: Install Chromium for the smoke suite
        run: npx --yes playwright@1.61.1 install --with-deps chromium

      - name: Resolve Chromium path
        run: |
          BIN=$(find "$HOME/.cache/ms-playwright" -name chrome -type f -path '*chrome-linux*' | head -1)
          test -n "$BIN" || { echo "Chromium not found"; exit 1; }
          echo "CHROMIUM_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Start the production server
        run: |
          PORT=3100 npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://localhost:3100/tv; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never became ready"; cat /tmp/server.log; exit 1

      - name: Signage persistence e2e (throwaway postgres:16)
        env:
          QR_VISITOR_HASH_SALT: ci-signage-visitor-salt
        run: |
          docker compose -f tests/signage-e2e/docker-compose.yml up -d
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null "http://127.0.0.1:54322/qr_scan_events?select=id&limit=1" \
              -H "apikey: $(node tests/signage-e2e/mint-jwt.mjs service_role)" \
              -H "Authorization: Bearer $(node tests/signage-e2e/mint-jwt.mjs service_role)"; then
              echo "signage postgrest ready after ${i}s"; break
            fi
            sleep 1
          done
          export SERVICE_KEY=$(node tests/signage-e2e/mint-jwt.mjs service_role)
          PORT=3105 \
            NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54323 \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_KEY" \
            QR_VISITOR_HASH_SALT=ci-signage-visitor-salt \
            npm start > /tmp/signage-e2e-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:3105/tv; then
              echo "signage e2e app ready after ${i}s"; break
            fi
            sleep 1
          done
          SIGNAGE_E2E_APP_URL=http://127.0.0.1:3105 npx tsx tests/signage-persistence-e2e.mjs
          docker compose -f tests/signage-e2e/docker-compose.yml down -v

      - name: Smoke suite
        run: npm run smoke

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true

  # Reports the lint backlog without gating the deploy. AGENTS.md rule 6
  # described this job before it existed; the build was silently enforcing
  # lint instead (see next.config.ts eslint.ignoreDuringBuilds). Promote this
  # into `gate` only when the burn-down is near-zero.
  lint:
    name: lint (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      # Reports the tally and always exits 0. `continue-on-error` still
      # renders a red ✗ on the check, and a permanently-failing check named
      # "non-blocking" trains everyone to ignore red — which is precisely how
      # five genuine CI failures sat unnoticed for two days. Red must mean
      # something. The count goes in the run summary so it can't rot quietly.
      - name: ESLint tally
        run: |
          set +e
          npm run lint > /tmp/lint.txt 2>&1
          set -e
          tail -40 /tmp/lint.txt
          TALLY=$(grep -oE '[0-9]+ problems? \([0-9]+ errors?, [0-9]+ warnings?\)' /tmp/lint.txt | tail -1)
          {
            echo "### ESLint backlog"
            echo ""
            echo "\`${TALLY:-no problems reported}\`"
            echo ""
            echo "Non-blocking by design (AGENTS.md rule 6). Burn down deliberately —"
            echo "the bulk are TV kiosk poll/rotation effects that never-blank depends on."
          } >> "$GITHUB_STEP_SUMMARY"
